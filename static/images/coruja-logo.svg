<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="owlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Modern Geometric Owl Head -->
  <path d="M 22 30 Q 18 12 36 22 Q 50 16 64 22 Q 82 12 78 30 Q 88 56 78 78 Q 50 92 22 78 Q 12 56 22 30 Z" fill="url(#owlGrad)" stroke="#C4B5FD" stroke-width="2"/>
  <!-- Feathers / Forehead -->
  <path d="M 38 22 L 50 36 L 62 22" stroke="#EDE9FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Eye Outer -->
  <circle cx="37" cy="46" r="14" fill="#08090C" stroke="#242832" stroke-width="2.5"/>
  <circle cx="37" cy="46" r="10" fill="url(#eyeGrad)"/>
  <circle cx="37" cy="46" r="5" fill="#08090C"/>
  <circle cx="39" cy="44" r="1.5" fill="#FFFFFF"/>
  <!-- Right Eye Outer -->
  <circle cx="63" cy="46" r="14" fill="#08090C" stroke="#242832" stroke-width="2.5"/>
  <circle cx="63" cy="46" r="10" fill="url(#eyeGrad)"/>
  <circle cx="63" cy="46" r="5" fill="#08090C"/>
  <circle cx="65" cy="44" r="1.5" fill="#FFFFFF"/>
  <!-- Golden Beak -->
  <polygon points="50,52 44,64 56,64" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
  <!-- Chest Accent -->
  <path d="M 36 72 Q 50 80 64 72" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
  <path d="M 40 78 Q 50 84 60 78" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
</svg>
