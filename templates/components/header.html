<header class="sticky top-0 z-50 w-full bg-[#08090C]/90 backdrop-blur-md border-b border-[#242832]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-4">
      
      <!-- Brand Logo -->
      <a href="/" class="flex items-center gap-2.5 group shrink-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-700 p-1 flex items-center justify-center shadow-lg shadow-purple-500/20 group-hover:scale-105 transition-transform">
          <img src="/static/images/coruja-logo.svg" alt="Coruja Logo" class="w-full h-full object-contain">
        </div>
        <div class="flex flex-col">
          <span class="font-extrabold text-lg tracking-tight text-white group-hover:text-purple-300 transition-colors">
            CORUJA <span class="text-amber-400">ACHOU</span>
          </span>
          <span class="text-[10px] text-zinc-400 -mt-1 font-medium hidden sm:block">Achadinhos & Ofertas</span>
        </div>
      </a>

      <!-- Desktop Search Bar -->
      <div class="hidden md:flex flex-1 max-w-md mx-4">
        <form action="/buscar" method="GET" class="w-full relative">
          <input 
            type="text" 
            name="q" 
            value="{{ request.args.get('q', '') }}" 
            placeholder="🔍 O que você está procurando hoje?"
            class="w-full bg-[#111318] border border-[#242832] rounded-full py-2 pl-4 pr-10 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all"
          >
          <button type="submit" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-amber-400 transition-colors" aria-label="Buscar">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </button>
        </form>
      </div>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
        <a href="/#categorias" class="text-zinc-300 hover:text-purple-400 transition-colors">
          Categorias
        </a>
        <a href="/#em-alta" class="text-zinc-300 hover:text-amber-400 flex items-center gap-1 transition-colors">
          <span>📈</span> Em Alta
        </a>
        <a href="/#achados" class="text-zinc-300 hover:text-purple-400 flex items-center gap-1 transition-colors">
          <span>🔥</span> Ofertas
        </a>
        <a href="/admin" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#171a22] hover:bg-purple-950/50 text-zinc-300 hover:text-purple-300 border border-[#242832] hover:border-purple-500/40 transition-all flex items-center gap-1.5">
          <span>🦉</span> Painel
        </a>
      </nav>

      <!-- Mobile Action Buttons -->
      <div class="flex items-center gap-2 md:hidden">
        <!-- Search Trigger -->
        <button 
          id="mobileSearchBtn" 
          type="button"
          class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#111318] border border-[#242832] text-zinc-300 hover:text-amber-400 transition-colors" 
          aria-label="Abrir busca"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>

        <!-- Menu Drawer Trigger -->
        <button 
          id="mobileMenuBtn" 
          type="button"
          class="w-10 h-10 flex items-center justify-center rounded-xl bg-[#111318] border border-[#242832] text-zinc-300 hover:text-purple-400 transition-colors" 
          aria-label="Abrir menu"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Collapsible Mobile Search Bar -->
    <div id="mobileSearchBar" class="hidden pb-3 pt-1 md:hidden">
      <form action="/buscar" method="GET" class="relative">
        <input 
          type="text" 
          name="q" 
          value="{{ request.args.get('q', '') }}" 
          placeholder="O que você procura hoje?"
          class="w-full bg-[#111318] border border-[#242832] rounded-xl py-2.5 pl-4 pr-10 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-purple-500"
        >
        <button type="submit" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-amber-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>
      </form>
    </div>

    <!-- Collapsible Mobile Navigation Links -->
    <div id="mobileNav" class="hidden md:hidden border-t border-[#242832] py-4 space-y-3">
      <a href="/" class="block px-3 py-2 rounded-lg text-base font-medium text-zinc-200 hover:bg-[#171a22] hover:text-purple-400">
        🏠 Início
      </a>
      <a href="/#em-alta" class="block px-3 py-2 rounded-lg text-base font-medium text-zinc-200 hover:bg-[#171a22] hover:text-amber-400">
        📈 Produtos em Alta
      </a>
      <a href="/#achados" class="block px-3 py-2 rounded-lg text-base font-medium text-zinc-200 hover:bg-[#171a22] hover:text-purple-400">
        🔥 Achados de Hoje
      </a>
      <div class="pt-2 border-t border-[#242832]/60">
        <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500 px-3 block mb-2">Categorias Populares</span>
        <div class="grid grid-cols-2 gap-2 px-1">
          {% for cat in nav_categories[:6] %}
          <a href="/categoria/{{ cat.slug }}" class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium text-zinc-300 bg-[#111318] border border-[#242832] hover:border-purple-500/40">
            <span>{{ cat.icon }}</span>
            <span class="truncate">{{ cat.name.replace(cat.icon, '')|trim }}</span>
          </a>
          {% endfor %}
        </div>
      </div>
      <div class="pt-3">
        <a href="/admin" class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl text-sm font-semibold bg-purple-600/20 text-purple-300 border border-purple-500/30">
          <span>🦉</span> Acessar Painel Admin
        </a>
      </div>
    </div>

  </div>
</header>
